[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-dip-scanner"
version = "0.1.0"
description = "Nasdaq-100 quality dip scanner"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "streamlit>=1.38",
  "streamlit-aggrid>=1.1.9",
  "yfinance>=0.2.40",
  "requests>=2.32",
  "plotly>=5.24",
]

[tool.setuptools.packages.find]
include = ["stockscreener*"]

[project.scripts]
stockscreener = "stockscreener.cli:main"
